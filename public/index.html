    <script>
        fetch('http://localhost:3000/getData')
          .then(response => response.json())
          .then(json => {
            movie1 = json[0]
            movie2 = json[1]
            movie3 = json[2]
            movie4 = json[3]
            movie5 = json[4]
            movie6 = json[5]
            movie7 = json[6]
            movie8 = json[7]
            movie9 = json[8]
            movie10 = json[9]

            document.getElementById('movie1_text').textContent = movie1.plot;
            document.getElementById('image1').src = movie1.poster;
            document.getElementById('image2').src = movie2.poster;
            document.getElementById('image3').src = movie3.poster;
            document.getElementById('image4').src = movie4.poster;
            document.getElementById('image5').src = movie5.poster;
            document.getElementById('image6').src = movie6.poster;
            document.getElementById('image7').src = movie7.poster;
            document.getElementById('image8').src = movie8.poster;
            document.getElementById('image9').src = movie9.poster;
            document.getElementById('image10').src = movie10.poster;
          })
          .catch((error) => {
            console.error('Error:', error);
          });
        </script>
