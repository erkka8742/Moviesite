    <script>
        fetch('http://localhost:3000/getData')
          .then(response => response.json())
          .then(json => {
            movie1 = json[0]
            movie2 = json[1]
            movie3 = json[2]
            movie4 = json[3]
            movie5 = json[4]
            movie6 = json[5]
            movie7 = json[6]
            movie8 = json[7]
            movie9 = json[8]
            movie10 = json[9]

            document.getElementById('image1').src = movie1.poster;
            document.getElementById('image2').src = movie2.poster;
            document.getElementById('image3').src = movie3.poster;
            document.getElementById('image4').src = movie4.poster;
            document.getElementById('image5').src = movie5.poster;

            document.getElementById('image9').src = movie9.poster;
            document.getElementById('image10').src = movie10.poster;

            document.getElementById('movie4_score').textContent = movie4.score;
            document.getElementById('movie5_score').textContent = movie5.score;
            document.getElementById('movie6_score').textContent = movie6.score;
            document.getElementById('movie7_score').textContent = movie7.score;
            document.getElementById('movie8_score').textContent = movie8.score;
            document.getElementById('movie9_score').textContent = movie9.score;
            document.getElementById('movie10_score').textContent = movie10.score;
          })
          .catch((error) => {

          });
