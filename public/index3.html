<!DOCTYPE html>
<html>
<head>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js" integrity="sha384-vtXRMe3mGCbOeY7l30aIg8H9p3GdeSe4IFlP6G8JMa7o7lXvnz3GFKzPxzJdPfGK" crossorigin="anonymous"></script>
    <title>Send Text</title>
</head>
<body>
    <form id="myForm">
        <input type="text" id="myText" placeholder="Type your text here">
        <button type="submit">Send</button>
    </form>

    <script>
 movie = ""
document.getElementById('myForm').addEventListener('submit', function(event) {
    // Prevent the form from being submitted normally
    event.preventDefault();

    // Get the text from the input field
   
    movie = document.getElementById('myText').value;

  let data2 = ""
    $.getJSON("https://api.themoviedb.org/3/search/movie?api_key=a11375df0e085d0b5ac37b8daa5aea27&query=" + movie + "&callback=?", function(data2) {
    
    if (data2.results.length == 0 ){                 
    console.log("movie not found")}
    else {
      data = movie

      fetch('http://localhost:3000/add_movies', {
  method: 'POST',
  headers: {
    'Content-Type': 'application/json'
  },
  body: JSON.stringify({data})
})
.then(response => response.json())
.then(data => console.log(data))
.catch(error => console.error('Error:', error));
    }
});

    

 
});
        


        
        
        
        </script>
</body>
</html>
