        var videoId = null;
    
        function extractVideoID(url) {
        let videoId = null;
        let regex = /(?:https?:\/\/)?(?:www\.)?youtube\.com\/watch\?v=([^&]+)|youtu\.be\/([^?]+)/;
        let match = url.match(regex);
    
        if (match && match[1]) {
            videoId = match[1];
        } else if (match && match[2]) {
            videoId = match[2];
        }
    
        return videoId;
    }

        var modwrapper = document.getElementsByClassName("modal_wrapper")[0]
        var mod_close = document.getElementsByClassName("modal_close")[0]
        var modinner = document.getElementsByClassName("modal_inner")[0]

        function playvideo() {
            modwrapper.classList.add("active")
            let iframe = document.createElement("iframe")
            iframe.setAttribute('src', 'https://www.youtube.com/embed/' + videoId + '?controls=1&autoplay=1&rel=0')

            iframe.setAttribute('frameborder', '0')
            iframe.setAttribute('allow', 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share')
            iframe.setAttribute('allowfullscreen', '')

            iframe.classList.add('modal_vid')

            modinner.append(iframe)
        }


        mod_close.addEventListener('click', function() {
