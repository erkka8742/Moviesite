        let thisMovie
        let url = window.location.href;
        let regex = /\/([^/]+)$/
;
        // otetaan tämän sivun url ja verrataan sitä elokuviin 
        let movieName = url.match(regex)[1];

       for (let i = 0; i <= 14; i++){
        if (movieName == json[i].name.replace(/ /g, "-").toLowerCase()){
            thisMovie = json[i]
        }
       }
       document.getElementById('movie-name1').textContent = thisMovie.name + ' - Moviesite';
       document.getElementById('movie-name2').textContent = thisMovie.name;
       document.getElementById('movie_score').textContent = thisMovie.score;

       document.getElementById('writers').textContent = thisMovie.writers;
       document.getElementById('actors').textContent = thisMovie.stars;
       document.getElementById('runtime').textContent = thisMovie.runtime;
       document.getElementById('plot').textContent = thisMovie.plot;

       function extractVideoID(url) {
    let videoId = null;
    let regex = /(?:https?:\/\/)?(?:www\.)?youtube\.com\/watch\?v=([^&]+)|youtu\.be\/([^?]+)/;
    let match = url.match(regex);
    
    if (match && match[1]) {
        videoId = match[1];
    } else if (match && match[2]) {
        videoId = match[2];
    }
    
    return videoId;
}

function playVideo() {
    var iframe = document.getElementById('youtubePlayer');
    iframe.src = "https://www.youtube.com/embed/" + videoId + "?autoplay=1&rel=1&modestbranding=1&iv_load_policy=3";

    // Hide the thumbnail
    var thumbnail = document.querySelector('.youtube-thumbnail');
    thumbnail.style.display = 'none';
}

var youtubeUrl = thisMovie.trailer;
var videoId = extractVideoID(youtubeUrl);

// Set the thumbnail image
var thumbnailImage = document.getElementById('youtubeThumbnailImage');
thumbnailImage.src = "https://img.youtube.com/vi/" + videoId + "/maxresdefault.jpg";

if (!videoId) {
    console.error("Invalid YouTube URL provided.");
}

    })

    


</script>
