<script src="http://localhost:7926/socket.io/socket.io.js"></script>
<script>

// setupataan liittyminen
const socket = io('http://localhost:7926');

// Get the current site URL
let url = window.location.href;

let regex = /.*\/([^\/]+)\/player/;
let match = url.match(regex);
let serverNumber = match[1];


function mouseOff() {
    var elements = document.getElementsByClassName('image-box');
        for (var i = 0; i < elements.length; i++) {
            elements[i].style.pointerEvents = 'none';
        }
}
function mouseOn() {
    var elements = document.getElementsByClassName('image-box');
    for (var i = 0; i < elements.length; i++) {
            elements[i].style.pointerEvents = 'auto';
        }
}

regexHover = /^Player1hover (\d+)$/;
regexOut = /^Player1out (\d+)$/;
regexClick = /^Player1click (\d+)$/;
var elementsHover = document.getElementsByClassName('image-box');
let incomingClick = false

var clickEvent = new MouseEvent('click', {
    'bubbles': true,
    'cancelable': true,
    'view': window
});

MyTurn = false
var elements = document.getElementsByClassName('image-box');
// Liitytään oikeaan huoneeseen
socket.emit('join-room', serverNumber);

socket.on('message', (data) => {
    //console.log(data);
    
    if (data === 'Player1 turn') {
        console.log('others turn')
        MyTurn = false

        // click pois
        for (var i = 0; i < elements.length; i++) {
            elements[i].style.pointerEvents = 'none';
        }
    }

    if (data === 'Player2 turn') {
        console.log('my turn')
        MyTurn = true

        // click päällä
        setTimeout(function() {
            for (var i = 0; i < elements.length; i++) {
            elements[i].style.pointerEvents = 'auto';
        }
        }, 1600);
    }

    if (Array.isArray(data)) {
        // elokuvat laitetaan sivulle 
        for (let i = 0; i < 24; i++) {
            document.getElementById('movie'+ String(i+1)+'name').id = data[i].poster;
        }
        // laitetaan musta kuva
        for (let i = 0; i < 24; i++) {
            document.getElementById('image'+String(i+1)).src = '/black.png';
        }
    }

    // tehdään toisen pelaajan input
    if (!Array.isArray(data)) {
        let matchHover = data.match(regexHover);
        let matchOut = data.match(regexOut);
        let matchClick = data.match(regexClick);
        if (matchHover) {
            let i = parseInt(matchHover[1], 10);
            elementsHover[i].classList.add('hoverEffect');
        }
        if (matchOut) {
            let i = parseInt(matchOut[1], 10); 
            elementsHover[i].classList.remove('hoverEffect');
        }
        if (matchClick) {
            let i = parseInt(matchClick[1], 10); 
            i--
            let click = document.getElementById('image'+ String(i+1))
            click.dispatchEvent(clickEvent)
        }
    }
});

// lähetetään hover toiselle pelaajalle
for (var i = 0; i < elementsHover.length; i++) {
    (function(index) {
        elementsHover[index].addEventListener('mouseover', function() {
            socket.emit('send-message', serverNumber, 'Player2hover ' + String(index));
        });
    })(i);
    (function(index) {
        elementsHover[index].addEventListener('mouseout', function() {
            socket.emit('send-message', serverNumber, 'Player2out ' + String(index));
        });
    })(i);
}

clicks = 0
mistakes = 0
selected1 = ""
selected2 = ""

function areTheySameIMG(a,b) {
    if (a.src == b.src){
        return true
    }
    else {
        return false
    }
}

// pelilogiikka
for (let i = 0; i < 24; i++) {
document.getElementById('image'+ String(i+1)).addEventListener("click", function() {
    clicks++
    var parentDiv = this.closest('div');
    var parentId = parentDiv.id;

    if (clicks == 1 && selected1 != this) {
        selected1 = this
        this.src = parentId
        this.style.filter = "brightness(100%)";
        if (MyTurn) {socket.emit('send-message', serverNumber, 'Player2click ' + this.id.match(/\d+/g));}
    }

    if (clicks == 2 && selected1 != this) {
        selected2 = this
        this.src = parentId
        this.style.filter = "brightness(100%)";
        if (MyTurn) {socket.emit('send-message', serverNumber, 'Player2click ' + this.id.match(/\d+/g));}
        if (!MyTurn) {
            for (var i = 0; i < elements.length; i++) {
            elements[i].style.pointerEvents = 'none';}
        }
        clicks = 0
        setTimeout(function() {
        if (areTheySameIMG(selected1,selected2)) {
            console.log("same")
            selected1.parentNode.removeChild(selected1);
            selected2.parentNode.removeChild(selected2);
        }
        else {
            mistakes++
            document.getElementById('mistakes').textContent = "Mistakes: " + mistakes;
            console.log("not same")
            selected2.style.filter = "brightness(0%)"
            selected1.style.filter = "brightness(0%)"
            setTimeout(() => {
                selected2.src = '/black.png'
                selected1.src = '/black.png'
            }, 500);
        }
        }, 1500); 
    }
    else if (clicks == 2 && selected1 == this) {
        clicks = 1
    }
});
}
