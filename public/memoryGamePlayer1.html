<script src="http://localhost:7926/socket.io/socket.io.js"></script>
<script>

fetch('http://localhost:3000/getData')
          .then(response => response.json())
          .then(json => {
            movie1 = json[0]
            movie2 = json[1]
            movie3 = json[2]
            movie4 = json[3]
            movie5 = json[4]
            movie6 = json[5]
            movie7 = json[6]
            movie8 = json[7]
            movie9 = json[8]
            movie10 = json[9]

    movies = [movie1, movie2, movie3, movie4, movie5, movie6, movie7, movie8, movie9, movie10, movie1, movie2, movie3, movie4, movie5, movie6, movie7, movie8, movie9, movie10]
    
  // movies array sekoitetaan  
  const shuffleArray = array => {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const temp = array[i];
    array[i] = array[j];
    array[j] = temp;
  }
}
shuffleArray(movies);
console.log(movies)

// elokuvat laitetaan sivulle 
for (let i = 0; i < 20; i++) {
    document.getElementById('image'+ String(i+1)).src = movies[i].poster;
}


// kun käyttäjä painaa kuvasta katsotaan mikä se on ja annetaan toinen mahdollisuus painaa
// jos sama niin poistetaan kortit https://www.memozor.com/

clicks = 0
mistakes = 0
selected1 = ""
selected2 = ""


function areTheySame(a,b) {
    if (a.src == b.src){
        return true
    }
    else {
        return false
    }
}

for (let i = 0; i < 20; i++) {
document.getElementById('image'+ String(i+1)).addEventListener("click", function() {
    clicks++
    this.style.filter = "brightness(100%)";
    if (clicks == 1) {
        selected1 = this
    }

    if (clicks == 2 && selected1 != this) {
        clicks = 0
        selected2 = this
        var elements = document.getElementsByClassName('image-box');
        for (var i = 0; i < elements.length; i++) {
            elements[i].style.pointerEvents = 'none';
        }
        setTimeout(function() {
        let same = areTheySame(selected1,selected2)
        if (same == true) {
            console.log("same")
            selected1.parentNode.removeChild(selected1);
            selected2.parentNode.removeChild(selected2);

        }
        else {
            mistakes++
            document.getElementById('mistakes').textContent = "Mistakes: " + mistakes;
            console.log("not same")
            selected2.style.filter = "brightness(0%)"
            selected1.style.filter = "brightness(0%)"
            
        }
        for (var i = 0; i < elements.length; i++) {
            elements[i].style.pointerEvents = 'auto';
        }
        }, 2000); 
    }
    else if (clicks == 2 && selected1 == this) {
        clicks = 1
    }
});
}

          })

// setupataan liittyminen
const socket = io('http://localhost:7926');

// Get the current site URL
let url = window.location.href;

// Use regex to extract the number after the port
let regex = /:(\d+)\//;
let match = url.match(regex);
let serverNumber = match[1];


// Liitytään oikeaan huoneeseen
socket.emit('join-room', serverNumber);
