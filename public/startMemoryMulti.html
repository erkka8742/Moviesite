<!DOCTYPE html>
<html>
<head>
  <link type="text/css"  rel="stylesheet" href="games.css">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js" integrity="sha384-vtXRMe3mGCbOeY7l30aIg8H9p3GdeSe4IFlP6G8JMa7o7lXvnz3GFKzPxzJdPfGK" crossorigin="anonymous"></script>
    <title>Games</title>
</head>
<body>

    <script>

// lähettää pelinkäynnistysviestin palvelimelle
async function startGame() { 
  
    try {
        const response = await fetch('http://localhost:5482/start_memory_game', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ data: "start" })
        });
        
        const responseText = await response.text();
        console.log(responseText);
        // avaa vastaanotetun pelisivun linkin 
        //window.location.href = responseText;
        window.open(responseText, '_blank');
    } catch (error) {
        console.error('Error:', error);
        // You might want to throw the error or return a default/error value depending on your use case
        throw error;
    }
}
startGame()
      
        
        </script>
</body>
</html>
